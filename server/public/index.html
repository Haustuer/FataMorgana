<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Voxel Room</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Voxel Room</h1>
    <div class="stats">
      <span id="deviceCount">Devices: 0</span>
      <span id="gridInfo">Voxel Preview: 15×15×15</span>
    </div>
  </header>

  <main class="quad-view">
    <div class="view-panel">
      <h3>Top (XY @ Z)</h3>
      <input type="range" id="layerZ" min="0" max="14" value="7">
      <table id="viewTop" class="slice-table"></table>
    </div>

    <div class="view-panel">
      <h3>Side X (YZ @ X)</h3>
      <input type="range" id="layerX" min="0" max="14" value="7">
      <table id="viewSideX" class="slice-table"></table>
    </div>

    <div class="view-panel">
      <h3>Side Y (XZ @ Y)</h3>
      <input type="range" id="layerY" min="0" max="14" value="7">
      <table id="viewSideY" class="slice-table"></table>
    </div>

    <div class="view-panel">
      <h3>3D View</h3>
      <canvas id="voxelCanvas"></canvas>
    </div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
